services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    
    restart: unless-stopped
    stop_grace_period: 60s
  
    network_mode: host
    environment:
      TZ: Asia/Jerusalem
